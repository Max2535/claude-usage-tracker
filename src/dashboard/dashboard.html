<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-{{NONCE}}' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; img-src data:;" />
  <title>Claude Usage Dashboard</title>
  <script nonce="{{NONCE}}" src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #1e1e2e;
      --surface: #2a2a3e;
      --border: #3a3a54;
      --accent: #7c6af7;
      --accent2: #4fc3f7;
      --green: #69db7c;
      --orange: #ffa94d;
      --text: #cdd6f4;
      --muted: #7f849c;
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      padding: 20px;
      min-height: 100vh;
    }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; color: #fff; }
    .subtitle { color: var(--muted); font-size: 12px; margin-bottom: 20px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }
    .card-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
    .card-value { font-size: 22px; font-weight: 700; color: #fff; }
    .card-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .card.accent .card-value { color: var(--accent); }
    .card.green .card-value { color: var(--green); }
    .card.orange .card-value { color: var(--orange); }
    .card.blue .card-value { color: var(--accent2); }

    .section { margin-bottom: 20px; }
    .section-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }
    canvas { max-height: 220px; }

    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { text-align: left; color: var(--muted); font-weight: 500; padding: 6px 10px; border-bottom: 1px solid var(--border); }
    td { padding: 7px 10px; border-bottom: 1px solid rgba(255,255,255,.04); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.03); }
    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      background: rgba(124,106,247,.2);
      color: var(--accent);
    }
    .badge.log { background: rgba(79,195,247,.15); color: var(--accent2); }
    .badge.manual { background: rgba(105,219,124,.15); color: var(--green); }

    .actions { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    button {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 12px;
      transition: background .15s, border-color .15s;
    }
    button:hover { background: var(--border); border-color: var(--accent); }
    button.danger:hover { border-color: #f38ba8; color: #f38ba8; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { background: #6a5be3; }
    .empty { color: var(--muted); font-style: italic; padding: 20px 10px; text-align: center; }
  </style>
</head>
<body>

<h1>⚡ Claude Usage Dashboard</h1>
<p class="subtitle" id="lastUpdated">Loading...</p>

<div class="actions">
  <button class="primary" onclick="refresh()">↻ Refresh</button>
  <button onclick="exportCSV()">⬇ Export CSV</button>
  <button class="danger" onclick="clearHistory()">✕ Clear History</button>
</div>

<!-- Today Summary Cards -->
<div class="section">
  <div class="section-title">Today</div>
  <div class="grid">
    <div class="card accent">
      <div class="card-label">Total Tokens</div>
      <div class="card-value" id="todayTotal">–</div>
      <div class="card-sub" id="todayDate">–</div>
    </div>
    <div class="card blue">
      <div class="card-label">Input Tokens</div>
      <div class="card-value" id="todayInput">–</div>
    </div>
    <div class="card orange">
      <div class="card-label">Output Tokens</div>
      <div class="card-value" id="todayOutput">–</div>
    </div>
    <div class="card green">
      <div class="card-label">Est. Cost</div>
      <div class="card-value" id="todayCost">–</div>
    </div>
    <div class="card">
      <div class="card-label">API Calls</div>
      <div class="card-value" id="todayCalls">–</div>
    </div>
  </div>
</div>

<!-- 7-Day Chart -->
<div class="section">
  <div class="section-title">Last 7 Days — Token Usage</div>
  <div class="chart-card">
    <canvas id="weekChart"></canvas>
  </div>
</div>

<!-- Recent Records Table -->
<div class="section">
  <div class="section-title">Recent Records</div>
  <div class="card" style="padding:0; overflow:hidden;">
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Model</th>
          <th>Input</th>
          <th>Output</th>
          <th>Cost</th>
          <th>Source</th>
        </tr>
      </thead>
      <tbody id="recordsBody">
        <tr><td colspan="6" class="empty">No records yet</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script nonce="{{NONCE}}">
  const vscode = acquireVsCodeApi();
  let weekChart = null;

  function fmt(n) {
    if (n >= 1e6) return (n/1e6).toFixed(2)+'M';
    if (n >= 1e3) return (n/1e3).toFixed(1)+'k';
    return n.toString();
  }

  function refresh() {
    vscode.postMessage({ command: 'refresh' });
  }

  function exportCSV() {
    vscode.postMessage({ command: 'exportCSV' });
  }

  function clearHistory() {
    if (confirm('Clear all Claude usage history? This cannot be undone.')) {
      vscode.postMessage({ command: 'clearHistory' });
    }
  }

  window.addEventListener('message', event => {
    const msg = event.data;
    if (msg.command === 'update') {
      renderData(msg.data);
    }
  });

  function renderData(data) {
    const { today, week, currency } = data;

    document.getElementById('lastUpdated').textContent =
      'Last updated: ' + new Date().toLocaleTimeString();
    document.getElementById('todayDate').textContent = today.date;
    document.getElementById('todayTotal').textContent =
      fmt(today.totalInput + today.totalOutput);
    document.getElementById('todayInput').textContent  = fmt(today.totalInput);
    document.getElementById('todayOutput').textContent = fmt(today.totalOutput);
    document.getElementById('todayCost').textContent   = today.totalCostFormatted;
    document.getElementById('todayCalls').textContent  = today.records.length;

    // 7-day chart
    const labels = week.map(d => d.date.slice(5));
    const inputData  = week.map(d => d.totalInput);
    const outputData = week.map(d => d.totalOutput);

    if (weekChart) weekChart.destroy();
    weekChart = new Chart(document.getElementById('weekChart'), {
      type: 'bar',
      data: {
        labels,
        datasets: [
          { label: 'Input',  data: inputData,  backgroundColor: 'rgba(79,195,247,.6)',  borderRadius: 4 },
          { label: 'Output', data: outputData, backgroundColor: 'rgba(124,106,247,.6)', borderRadius: 4 },
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#7f849c', font: { size: 11 } } } },
        scales: {
          x: { stacked: false, ticks: { color: '#7f849c' }, grid: { color: 'rgba(255,255,255,.05)' } },
          y: { ticks: { color: '#7f849c', callback: v => fmt(v) }, grid: { color: 'rgba(255,255,255,.05)' } }
        }
      }
    });

    // Records table (today's, newest first)
    const tbody = document.getElementById('recordsBody');
    const records = [...today.records].reverse().slice(0, 50);
    if (records.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty">No records for today yet</td></tr>';
      return;
    }

    tbody.innerHTML = records.map(r => `
      <tr>
        <td>${new Date(r.timestamp).toLocaleTimeString()}</td>
        <td>${r.model}</td>
        <td>${fmt(r.inputTokens)}</td>
        <td>${fmt(r.outputTokens)}</td>
        <td>${r.costFormatted}</td>
        <td><span class="badge ${r.source}">${r.source}</span></td>
      </tr>
    `).join('');
  }

  // Request initial data
  refresh();
</script>
</body>
</html>
